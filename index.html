<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>失衡・公寓觀察</title>
<meta name="imb-build" content="2026-11-10 15:39 (台北)">
<style>
:root{
  --bg:#f7f1e8; --card:#fffaf3; --line:#e8dccb; --ink:#4a3f35; --muted:#9a8b7b; --accent:#c9876b; --accent2:#e7b9a3;
  --soft:#efe4d4; --rose:#e58fa0; --green:#7fa37a; --shadow:0 2px 10px rgba(120,90,60,.10);
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:10px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn.danger{color:#b4544a;border-color:#e6c2bb}

/* start */
.start-inner{padding:28px 16px 40px}
.logo{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--accent);font-family:"Noto Serif CJK TC","Noto Serif TC",serif}
.sub{text-align:center;color:var(--muted);margin-bottom:18px;letter-spacing:2px}
#newForm h2{margin:0 0 10px;font-size:17px}
#newForm label{display:block;margin:8px 0;font-size:13px;color:var(--muted)}
#newForm input,#newForm textarea,select{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}
.row2{display:grid;grid-template-columns:90px 1fr;gap:10px}
.field-title{font-size:13px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.swatch{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.layouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.layout-card{border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;cursor:pointer}
.layout-card.on{border-color:var(--accent)}
.layout-card b{font-size:13px;display:block}
.layout-card .mini{position:relative;width:100%;aspect-ratio:100/130;margin:6px 0;background:var(--soft);border-radius:6px;overflow:hidden}
.layout-card .mini div{position:absolute;border:1px solid #d6c6b0;background:#f6ecdd}
.layout-card .mini div.h{background:#e6d9c6;border:none}
.res-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
#newForm .res-row input[type=checkbox],.res-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);display:inline-block;margin:0;flex:none}
.res-row .nm{flex:1;font-size:14px}
.res-row select{width:auto;margin:0;padding:5px 8px;font-size:13px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#continueBox{margin-bottom:12px}

/* game */
#game{padding-bottom:70px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,241,232,.95);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
.clock{display:flex;flex-direction:column;line-height:1.15}
.clock span{font-size:12px;color:var(--muted)}
.clock b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.speeds{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.speeds button{border:none;background:none;padding:6px 5px;border-radius:9px;font-size:12.5px;cursor:pointer;min-width:28px}
.topbar{flex-wrap:wrap;position:sticky}
.speeds button.ffbtn{font-size:14px}
.ffpick,.ffbar{position:absolute;right:10px;top:100%;margin-top:4px;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:5px 6px;font-size:12px;z-index:25}
.ffpick.hidden,.ffbar.hidden{display:none}
.ffpick span{color:var(--muted);padding:0 4px}
.ffpick button,.ffbar button{border:none;background:var(--soft);border-radius:8px;padding:6px 7px;font-size:12px;cursor:pointer}
.ffbar{color:var(--accent);font-weight:700}
.ffbar button{color:inherit;font-weight:400}
.speeds button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent);font-weight:700}
.view{padding:10px 10px 16px}
.outstrip{display:flex;align-items:center;gap:6px;min-height:30px;font-size:12px;color:var(--muted);padding:0 2px 6px;flex-wrap:wrap}
.outstrip .mini-av{width:24px;height:24px;opacity:.75}
.plan-wrap{background:#efe3d1;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 1px var(--line)}
.plan{position:relative;z-index:0;isolation:isolate;width:100%;aspect-ratio:100/130;border-radius:12px;overflow:hidden;transition:filter 1s}
.plan.night{filter:brightness(.82) saturate(.85)}
.plan.dusk{filter:brightness(.93) sepia(.08)}
.room{position:absolute;border:2px solid #d9c7af;background:#f6ecdc;cursor:pointer}
.room .rl{position:absolute;left:5px;top:3px;font-size:11px;color:#8d7a66;white-space:nowrap;pointer-events:none;max-width:95%;overflow:hidden;text-overflow:ellipsis}
.room .ri{position:absolute;right:5px;bottom:2px;font-size:15px;opacity:.55;pointer-events:none}
.room.t-living{background:#f3e5cf}.room.t-kitchen{background:#f4ecd9}.room.t-bath{background:#e4eff0}
.room.t-balcony{background:#e6efdc}.room.t-entry{background:#eee3d4}.room.t-bed{background:#f7eadf}
.room.mine{background:#fbe6e6}
.room.empty{background:repeating-linear-gradient(45deg,#f1e8db,#f1e8db 6px,#ebe0d0 6px,#ebe0d0 12px)}
.room.door-closed::after{content:'🔒';position:absolute;right:4px;top:2px;font-size:11px}
.hall{position:absolute;background:#e7dac6}
.token{position:absolute;width:27px;height:27px;transform:translate(-50%,-55%);cursor:pointer;z-index:3;transition:opacity .4s}
.token svg{width:27px;height:27px;display:block;filter:drop-shadow(0 1px 2px rgba(80,50,30,.35))}
.token.hero svg{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 2px var(--rose)) drop-shadow(0 1px 2px rgba(80,50,30,.35))}
.token .tn{position:absolute;top:25px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1.3;white-space:nowrap;background:rgba(255,250,243,.85);padding:0 3px;border-radius:4px;color:#6d5b4a;pointer-events:none}
.token .ti{position:absolute;top:-9px;right:-7px;font-size:12px;background:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.token .tb{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 6px;font-size:10px;white-space:nowrap;box-shadow:var(--shadow);pointer-events:none;z-index:5}
.token .tag{position:absolute;bottom:30px;z-index:6;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;white-space:nowrap;pointer-events:none}
.token.sel svg{outline:2px solid var(--accent);border-radius:50%}
.hero-panel{margin-top:10px;display:flex;gap:10px;align-items:center}
.hero-panel .hp-main{flex:1;min-width:0}
.hero-panel .hp-act{font-weight:600}
.hero-panel .hp-btns{display:flex;flex-direction:column;gap:6px}
.av{width:44px;height:44px;flex:none}
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.need{font-size:10px;color:var(--muted);text-align:center}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.bar.low i{background:#d88b6f}
.bar.aff i{background:var(--accent)} .bar.des i{background:var(--rose)}
.bar.neg i{background:#9aa3b2}
.ticker{margin-top:10px;font-size:13px;min-width:0}
.ticker .tklist{max-height:170px;overflow:auto}
.ticker .tklist>div{padding:3px 0;border-bottom:1px dashed var(--line)}
.ticker .tklist>div:last-child{border:none}
.tm{color:var(--muted);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(255,250,243,.97);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:none;background:none;padding:6px 0 8px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.tabs button i{font-style:normal;font-size:19px;line-height:1.3;filter:grayscale(.6);opacity:.8}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button.on i{filter:none;opacity:1}

h3.sec{font-size:15px;margin:14px 4px 8px;color:#7a6654}
.pcard{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.pcard .av{width:52px;height:52px}
.pcard .pm{flex:1;min-width:0}
.pcard .pn{font-weight:700;font-size:16px}
.pcard .pj{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:1px 8px;font-size:11px;margin:2px 3px 0 0}
.pill.r{background:#fbe1e4;color:#b05468}
.pill.a{background:#f6e2d6;color:#a2603f}
.kv{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;font-size:13px;margin:6px 0}
.kv .k{color:var(--muted)}
.relrow{display:grid;grid-template-columns:82px 1fr;gap:4px 8px;align-items:center;font-size:12px}
.relrow .lb{color:var(--muted);white-space:nowrap}
.rel-card{margin-bottom:10px}
.rel-card .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rel-card .rh .av{width:36px;height:36px}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:12px;margin:0 auto}
.matrix th{font-weight:500;color:var(--muted);padding:2px}
.matrix th .av{width:26px;height:26px;display:block;margin:auto}
.matrix td{width:40px;height:34px;text-align:center;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;padding:7px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:700;color:var(--accent)}
.whochips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:6px}
.whochips .chip{flex:none}
.whochips .chip .av{width:20px;height:20px}
.entry{margin-bottom:10px}
.entry .eh{font-size:12px;color:var(--muted);margin-bottom:4px}
.entry p{margin:0 0 4px}
.logline{font-size:13px;padding:6px 2px;border-bottom:1px dashed var(--line)}

.sheet-back{position:fixed;inset:0;background:rgba(60,40,25,.28);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:82vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:41;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(80,50,30,.18)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.sheet h3{margin:0;font-size:18px}
.sheet .sh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.sheet .sh .av{width:62px;height:62px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.agrid .btn{flex-direction:column;padding:10px 4px;font-size:13px;gap:2px}
.agrid .btn i{font-style:normal;font-size:20px}
.agrid .btn small{font-size:10px;color:var(--muted)}
.memo{font-size:13px;border-left:3px solid var(--accent2);padding:2px 8px;margin:6px 0}
.modal{position:fixed;inset:0;z-index:60;background:rgba(60,40,25,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(60,40,25,.3);text-align:center;animation:pop .25s ease}
.modal .box .av{width:76px;height:76px;margin:0 auto 6px}
.modal .box .who{font-weight:700;font-size:17px}
.modal .box .req{margin:10px 0 6px;font-size:15px;text-align:left;background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.modal .box .meta{font-size:12px;color:var(--muted)}
.modal .box .acts{display:flex;gap:10px;margin-top:14px}
.modal .box .acts .btn{flex:1}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:70;width:92%;max-width:440px;pointer-events:none}
.toast{background:rgba(74,63,53,.92);color:#fff;padding:9px 13px;border-radius:12px;margin-bottom:6px;font-size:13px;animation:pop .2s ease;box-shadow:var(--shadow)}
@media (min-width:900px){
  #app{max-width:980px}
  #game{display:grid;grid-template-columns:1fr;}
  #v-home{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:14px;align-items:start}
  #v-home .outstrip{grid-column:1/-1}
  #v-home .plan-wrap{grid-row:2/5}
  #v-home .hero-panel,#v-home .ticker{margin-top:0}
  #v-home .ticker .tklist{max-height:380px}
  .tabs{max-width:980px}
}

.autotog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer;user-select:none}
.autotog input{display:none}
.autotog .sw{width:30px;height:17px;border-radius:9px;background:#d9cbb8;position:relative;transition:.2s;flex:none}
.autotog .sw::after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
.autotog input:checked+.sw{background:var(--accent)}
.autotog input:checked+.sw::after{left:15px}
.autotog input:checked~*{color:var(--ink)}

.avimg{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;border:2px solid #e8dccb;background:#fff;box-sizing:border-box}
.token .avimg{width:27px;height:27px;box-shadow:0 1px 3px rgba(80,50,30,.35)}
.token.hero .avimg{box-shadow:0 0 0 2px #fff,0 0 4px 2px var(--rose)}
.token.sel .avimg{outline:2px solid var(--accent);outline-offset:1px}
span.av,div.av{display:inline-block;border-radius:50%}
.avpick{display:flex;align-items:center;gap:10px}
.avpick .av{width:52px;height:52px}

.floortabs{display:flex;gap:6px;margin-bottom:6px}
.floortabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 4px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.floortabs button small{font-size:10px;color:var(--muted)}
.floortabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.floortabs button.on small{color:#fbe9e0}
.floortabs button.follow{flex:none;font-size:11px;padding:5px 8px;justify-content:center}
.floortabs button.follow.on{background:#fbe6e6;color:#b05468;border-color:#efc4cb}
.deco{position:absolute;display:flex;align-items:center;justify-content:center;font-size:16px;background:#ddcdb5;border-radius:4px;pointer-events:none}
.token .tb{white-space:normal;width:max-content;max-width:130px;text-align:center;line-height:1.3}

/* ---- 詳細平面圖（三層排屋） ---- */
.room.detailed{border:3px solid #8f7a63;background:#f4e7d4}
.room.detailed.t-bed{background:repeating-linear-gradient(90deg,#f3e3cc 0 9px,#eedcc2 9px 10px)}
.room.detailed.mine{background:repeating-linear-gradient(90deg,#f8e4e0 0 9px,#f2d8d3 9px 10px)}
.room.detailed.t-kitchen,.room.detailed.t-wc{background:#f4f1ea;background-image:linear-gradient(#e6e0d4 1px,transparent 1px),linear-gradient(90deg,#e6e0d4 1px,transparent 1px);background-size:12px 12px}
.room.detailed.t-living{background:repeating-linear-gradient(90deg,#efdcc1 0 12px,#e9d4b6 12px 13px)}
.room.detailed.t-entry{background:#ece4d8;background-image:linear-gradient(45deg,#e2d7c6 25%,transparent 25%,transparent 75%,#e2d7c6 75%),linear-gradient(45deg,#e2d7c6 25%,transparent 25%,transparent 75%,#e2d7c6 75%);background-size:14px 14px;background-position:0 0,7px 7px}
.room.detailed.t-terrace,.room.t-terrace{background:repeating-linear-gradient(0deg,#d9c3a0 0 7px,#cdb48d 7px 8px)}
.room.detailed .rl{background:rgba(255,250,243,.82);border-radius:4px;padding:0 4px;z-index:2;font-size:10.5px}
.room.detailed .rl.rl-r{left:auto;right:4px} .room.detailed .rl.rl-l{left:4px}
.hall{background:#e2d4bf}
.deco.stairs{background:repeating-linear-gradient(0deg,#c9b394 0 3px,#e8dac4 3px 7px);border:1px solid #a58e70;border-radius:2px}
.fu{position:absolute;pointer-events:none;box-sizing:border-box}
.f-ensuite{background:#e7f0f1;background-image:linear-gradient(#d3e1e3 1px,transparent 1px),linear-gradient(90deg,#d3e1e3 1px,transparent 1px);background-size:8px 8px;border:2px solid #8f7a63}
.f-edoor{background:#f4e7d4}
.f-shower{background:repeating-linear-gradient(45deg,#cfe0e4 0 2px,#e9f3f5 2px 5px);border:1px solid #9fb8bd;border-radius:2px}
.f-shower::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#8aa6ad;left:50%;top:50%;transform:translate(-50%,-50%)}
.f-toilet{background:#fff;border:1px solid #a9b3b5;border-radius:45% 45% 50% 50%/30% 30% 70% 70%}
.f-toilet::before{content:'';position:absolute;left:10%;right:10%;top:0;height:28%;background:#f1f4f4;border-bottom:1px solid #a9b3b5;border-radius:2px}
.f-sink,.f-ksink{background:#fff;border:1px solid #a9b3b5;border-radius:3px}
.f-sink::after,.f-ksink::after{content:'';position:absolute;inset:22%;border-radius:40%;background:#e3ecee;border:1px solid #c3d0d3}
.f-bed{background:#fdfbf7;border:1px solid #b9a68e;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.f-bed::before{content:'';position:absolute;top:8%;bottom:8%;width:20%;background:linear-gradient(#fff 0 44%,transparent 44% 56%,#fff 56%);border-radius:2px}
.f-bed.head-l::before{left:5%;box-shadow:0 0 0 1px #d9cdbd} .f-bed.head-r::before{right:5%;box-shadow:0 0 0 1px #d9cdbd}
.f-bed::after{content:'';position:absolute;top:0;bottom:0;width:58%;background:linear-gradient(90deg,#e7b9a3,#dca48b);opacity:.85;border-radius:2px}
.f-bed.head-l::after{right:0} .f-bed.head-r::after{left:0}
.f-nightstand{background:#c8a47b;border-radius:1px}
.f-desk{background:#d6b68a;border:1px solid #b59266;border-radius:1px}
.f-monitor{background:#3a3a40;border-radius:1px;box-shadow:0 0 3px rgba(120,170,220,.6)}
.f-chair{background:#9e968e;border-radius:50%;border:1px solid #7d746b}
.f-wardrobe{background:linear-gradient(90deg,#b78f63 0 49%,#8d6c49 49% 51%,#b78f63 51%);border:1px solid #8d6c49;border-radius:1px}
.f-shelf{background:repeating-linear-gradient(0deg,#b38a5f 0 2px,#d9bd94 2px 6px);border:1px solid #93704b}
.f-armchair{background:#c9a99a;border-radius:30%;border:2px solid #b08d7d}
.f-sofa{background:#b9a28b;border-radius:4px;border:3px solid #a08870}
.f-sofa.face-l{border-left-width:1px;border-right-width:5px}
.f-tv{background:#2f2f33;border-radius:1px}
.f-ctable,.f-otable{background:#cfae84;border:1px solid #a98458;border-radius:3px}

['「你拍得好看。」','他愣了一下，然後笑得很開心，「這個答案我收下了。」他把雜誌闔上，「下次換你上封面，我保證不讓你同手同腳。」'],

E('jasper','j1w',1,['entry'],'',

['戴上安全帽','你們在城市裡繞了一個下午。紅燈的時候，他回頭對你說了什麼，風太大你沒聽清楚。他笑著說：「沒關係，重要的話我會再說一次。」'],

['坐到他身邊','你在他旁邊坐下。他把底片盒放進你手心，合上你的手指。「裡面是空的，」他說，「留給以後。」'],

['坐下來陪他','你坐到他旁邊。五分鐘後，他已經睡著了，頭慢慢歪到你的肩膀上。你沒有動，一直等到他自己醒來，紅著臉道歉。'],
['幫他按按手臂','你捏了捏他的手臂，他痛得倒吸一口氣，然後笑出聲。「再用力一點……啊，對，就是那裡。」他聽起來快哭了，也很幸福。'],

['「每天的早餐，你都怎樣？」','他的臉紅到耳根，沉默了很久。「……都想做給你吃。」他說，聲音小得幾乎被水聲蓋過，「不只是因為你是室友。」'],

/* ---------- 幾何與路徑 ---------- */
function buildGeo(layoutId){
  for (const k in SEAT_CACHE) delete SEAT_CACHE[k];
  const L = LAYOUTS[layoutId]; const rooms = {}; const pts = {}; const adj = {}; const ecost = {};
  const segF = i => (L.segFloor ? L.segFloor[i] : 0);
  const key = (p, f) => `${f}|${Math.round(p[0]*10)/10},${Math.round(p[1]*10)/10}`;
  const addPt = (p, f) => { const k = key(p, f); pts[k] = {x:p[0], y:p[1], f}; adj[k] = adj[k] || []; return k; };
  const proj = (seg, p) => seg[0][0] === seg[1][0] ? [seg[0][0], p[1]] : [p[0], seg[0][1]];
  const onSeg = (seg, p) => { const [a,b] = seg; const minx=Math.min(a[0],b[0])-.01,maxx=Math.max(a[0],b[0])+.01,miny=Math.min(a[1],b[1])-.01,maxy=Math.max(a[1],b[1])+.01; return p[0]>=minx&&p[0]<=maxx&&p[1]>=miny&&p[1]<=maxy && (a[0]===b[0] ? Math.abs(p[0]-a[0])<.01 : Math.abs(p[1]-a[1])<.01); };
  L.segs.forEach((seg, si) => {
    const f = segF(si); const list = [seg[0], seg[1]];
    L.rooms.filter(r => r.seg === si).forEach(r => list.push(proj(seg, r.door)));
    L.segs.forEach((o, oi) => { if (oi !== si && segF(oi) === f) [o[0], o[1]].forEach(p => { if (onSeg(seg, p)) list.push(p); }); });
    (L.stairs || []).forEach(st => { if ((st[0] === f || st[1] === f) && onSeg(seg, st[2])) list.push(st[2]); });
    const vert = seg[0][0] === seg[1][0];
    const ks = [...new Set(list.map(p => addPt(p, f)))].sort((a, b) => vert ? pts[a].y - pts[b].y : pts[a].x - pts[b].x);
    for (let i = 1; i < ks.length; i++){ adj[ks[i-1]].push(ks[i]); adj[ks[i]].push(ks[i-1]); }
  });
  (L.stairs || []).forEach(([fa, fb, p]) => { const a = addPt(p, fa), b = addPt(p, fb); adj[a].push(b); adj[b].push(a); ecost[a+'>'+b] = ecost[b+'>'+a] = 40; });
  L.rooms.forEach(r => { const f = r.f || 0; rooms[r.id] = {...r, f, node:key(proj(L.segs[r.seg], r.door), f), cx:r.x+r.w/2, cy:r.y+r.h/2}; });
  return { L, rooms, pts, adj, ecost, floors: L.floors || null };

const EV_PRI = ['sex','caress','night','morning','photo','studio','intimate','after','cxd','group','act','solo','laugh','jealous','flirt','hug','care','together','office','rejected','refused','chat','npc'];
function writeDiary(id){
  const D = DIARY[id], hn = S.hero.name, ev = S.dayEv[id];
  const out = [rnd(D.open)];
  const seen = new Set(); const sorted = [...ev].sort((a, b) => EV_PRI.indexOf(a.type) - EV_PRI.indexOf(b.type));
  let n = 0;

    if (k === 'cxd' || k === 'group'){ out.push(String(e.x || '').replace(/[。！？!?…」]?$/, m => m || '。')); n++; continue; }   // 玩家自訂的日記句子、一起做事

}
function topAct(id){ const m = S.ents[id].actMin; const ks = Object.keys(m).filter(k => !['sleep','walk','idle','wait'].includes(k)).sort((a, b) => m[b] - m[a]); return ks[0] ? ACTS[ks[0]].label : ''; }

    const k = e.type === 'together' || e.type === 'act' ? e.type + ':' + y : e.type; (groups[k] = groups[k] || {type:e.type, y, names:new Set()}).names.add(xn); }

/* ---------- 畫面上的走路動畫：和遊戲時間脫鉤 ----------
   1x～300x：邏輯位置和頭像用同一個速度（visSpeed）即時走，1x 時一段約 1～2 秒，走到的那一刻就開始做事（onArrive）。
   ⏩ 快轉與離線補算：邏輯照遊戲分鐘走（每分鐘 WALK 單位＋換樓層成本），頭像跟著。 */
const VIS_BASE = 45;                                   // 1x 時每「真實秒」走 45 單位（平面圖寬 100）
const visSpeed = sp => sp <= 0 ? 0 : Math.max(VIS_BASE * (1 + Math.log10(sp)), WALK * MIN_PER_SEC * sp * 1.1);
const VIS = {};
function visOf(e){ let v = VIS[e.id]; if (!v){ v = VIS[e.id] = {x:e.x, y:e.y, f:e.f || 0, q:[], src:e.path}; } return v; }
function snapVis(){ for (const e of allEnts()){ const v = visOf(e); v.x = e.x; v.y = e.y; v.f = e.f || 0; v.src = e.path; v.q = e.path.map(w => ({x:w.x, y:w.y, f:w.f})); if (v.q.length){ const w = v.q[v.q.length - 1]; v.x = w.x; v.y = w.y; v.f = w.f ?? v.f; v.q = []; } } }
function updVis(dt){
  const V = visSpeed(S.speed);
  for (const e of allEnts()){
    const v = visOf(e);
    if (e.hidden){ v.x = e.x; v.y = e.y; v.f = e.f || 0; v.q = []; v.src = e.path; continue; }
    if (e.path !== v.src){                                // 換了新路線：從他現在的位置沿新路線走
      v.src = e.path; v.q = e.path.map(w => ({x:w.x, y:w.y, f:w.f}));
      if (v.q.length && Math.hypot(v.x - e.x, v.y - e.y) > 3 && (v.f === (e.f || 0))) v.q.unshift({x:e.x, y:e.y, f:e.f});
    }
    if (!v.q.length && !walking(e)){                       // 沒在走：跟上邏輯位置（大跳躍或換樓層直接到位）
      const d = Math.hypot(e.x - v.x, e.y - v.y);
      if (d > 0.01){ if (d > 60 || v.f !== (e.f || 0)){ v.x = e.x; v.y = e.y; v.f = e.f || 0; } else v.q.push({x:e.x, y:e.y, f:e.f}); }
    }
    let budget = V * dt;
    while (budget > 0 && v.q.length){
      const w = v.q[0], dx = w.x - v.x, dy = w.y - v.y, d = Math.hypot(dx, dy);
      if (d <= budget){ v.x = w.x; v.y = w.y; if (w.f != null) v.f = w.f; budget -= d; v.q.shift(); }
      else { v.x += dx / d * budget; v.y += dy / d * budget; budget = 0; }
    }
  }
}

<script>
/* ---------- 一起做事（多人）：女主角選自己的行動時，可以順便邀幾位室友 ----------
   只限非親密的日常活動；親密、獨處、洗澡、睡覺永遠只有一對一（或自己）。
   被邀的人依個性、好感、心情、作息決定答不答應；答應的人走過去一起做，做完大家好感上升、
   室友之間的交情也會變（彼此較勁的人湊在一起會有火藥味）。所有玩家看得到的字都用 esc()。 */
const GRP = {
  cook:   {v:'一起做了飯', p:.62, like:{liam:.25, theo:.08, samuel:.05}},
  snack:  {v:'一起吃了點東西', p:.66, like:{theo:.15, liam:.1}},
  relax:  {v:'一起看了電影', p:.62, like:{jasper:.15, theo:.12, marcus:.05}},
  balcony:{v:'一起在陽台吹風', p:.55, like:{jasper:.12, marcus:.1, alexander:.05}},
  shop:   {v:'一起出門逛街', p:.48, like:{jasper:.15, theo:.15, alexander:-.1, samuel:-.12}},
  read:   {v:'一起窩著看書', p:.5, like:{alexander:.18, samuel:.08, theo:-.1}},
  jog:    {v:'一起去慢跑', p:.45, like:{theo:.25, liam:.05, samuel:-.1}},
  game:   {v:'一起打電動', p:.55, like:{samuel:.28, theo:.18, alexander:-.15}},
  music:  {v:'一起聽歌', p:.5, like:{marcus:.25, jasper:.05}},
  photo:  {v:'一起到露臺拍照', p:.5, like:{jasper:.3}},
  draw:   {v:'一起在桌前畫圖', p:.45, like:{alexander:.2, jasper:.08}},
  coffee: {v:'一起喝了咖啡', p:.66, like:{alexander:.15, samuel:.12, marcus:.08}},
};
// 室友主動找大家一起做的事（每個人偏好的）
const GRP_HOST = {alexander:['coffee','read'], jasper:['relax','balcony','shop'], liam:['cook','snack'], marcus:['relax','balcony'], samuel:['game','snack'], theo:['snack','relax','game']};
const GRP_LINES = {
  alexander:['「好。」他闔上期刊站起來。', '「今天不了。」'],
  jasper:['「這種場面怎麼能少了我？」', '「下次吧，我還有片子要修。」'],
  liam:['「好啊！我順便帶點吃的。」', '「抱歉，我現在走不開……下次一定。」'],
  marcus:['他點點頭，「行。」', '「我想一個人待著。」'],
  samuel:['「我、我也可以去嗎……好。」', '「……我還是不要好了，對不起。」'],
  theo:['「要要要！等我一下！」', '「蛤～我現在不行啦！」'] };
const GRP_TENSE = ['{a} 和 {b} 整段時間都在暗暗較勁，你夾在中間有點尷尬。', '{a} 刻意坐到你旁邊，{b} 的臉色一下子沉了下來。', '{a} 和 {b} 誰也不讓誰，氣氛有點微妙。'];
const GRP_WARM = ['{a} 和 {b} 也聊得很開心。', '{a} 跟 {b} 一搭一唱，你笑得停不下來。'];
const grpOk = aid => !!GRP[aid];
// 這位室友現在能不能找：[可以?, 說明]
function grpAvail(id){
  const o = S.ents[id]; if (!o) return [false, '不在'];
  if (!home(o) || o.hidden || o.room === 'out' || (o.dest === 'out' && walking(o))) return [false, '不在家'];
  if (o.act === 'sleep' || o.act === 'nap') return [false, '在睡覺'];
  if (o.busy || o.grp || (S.inter && S.inter.who === id) || (S.pending && (S.pending.collide || [S.pending.who]).includes(id)) || (o.ov && o.ov.solo)) return [false, '在忙'];
  if (o.act === 'shower') return [false, '在洗澡'];

}
function grpP(id, aid, inv){
  const d = GRP[aid], o = S.ents[id], C = CHAR[id];
  let p = d.p + S.aff[id].h / 200 + (moodOf(o) - 50) / 300 + compatOf(id) * 0.03 + (d.like[id] || 0) - (S.jeal[id] || 0) / 400;
  if (['work','code','study','draw','music','photo','class'].includes(o.act)) p -= 0.15;
  if (inv.length >= 2){ if (id === 'samuel') p -= 0.12; if (id === 'alexander') p -= 0.06; if (id === 'theo') p += 0.08; }   // 人多：Samuel 怕人多、Theo 喜歡熱鬧

  const h = hourOf(S.t); if (h >= 23.5 || h < 7) p -= 0.2;
  return clamp(p, 0.05, 0.95);
}
// 開始一起做：先依序問每個人，答應的走過去
function startGroup(aid, ids, opt = {}){
  const a = H_ACTIONS.find(x => x.id === aid); if (!a || !grpOk(aid)) return;

  const yes = [], no = [];
  for (const id of ids){ if (!S.residents.includes(id)) continue; const [ok, why] = grpAvail(id);
    if (!ok){ no.push([id, `${nm(id)} ${why}。`]); continue; }
    if (opt.pre || Math.random() < grpP(id, aid, ids)) yes.push(id); else no.push([id, `${nm(id)}：${GRP_LINES[id][1]}`]); }
  S.hPending = null; S.hAction = {...a, room, until:null, auto:false, gid};
  if (opt.host) log(`🎉 ${nm(opt.host)} 約你和 ${yes.filter(x => x !== opt.host).map(nm).join('、') || '大家'}「${a.label}」。`, ['h', ...yes]);
  else log(`🎉 你約了 ${ids.map(nm).join('、')} 一起「${a.label}」。`, ['h', ...ids]);
  yes.filter(id => id !== opt.host).forEach(id => log(`${nm(id)}：${GRP_LINES[id][0]}`, [id, 'h']));
  no.forEach(([id, t]) => { log(t, [id, 'h']); dayEv(id, 'refused'); });
  if (!yes.length){ toast('沒有人能來，你自己去。'); S.group = null; return; }
  S.group = {id:gid, aid, room, v:GRP[aid].v, members:yes, host:opt.host || null, t0:S.t};
  yes.forEach(id => { const e = S.ents[id]; e.busy = true; e.grp = gid; e.ov = null; e.dest = null;
    route(e, room, room === 'out' ? undefined : spotKey(a.act, room)); e.act = walking(e) ? 'walk' : a.act; e.label = `要和 ${hn} ${GRP[aid].v.replace(/了/, '')}`; bubble(id, '🎉', 20); });
  toast(`${yes.map(nm).join('、')} 會一起來`);
}
// 每分鐘：同伴跟著她一起做；她的行動結束或被打斷就散會
function groupTick(){
  const g = S.group; if (!g) return;
  const A = S.hAction;
  if (!A || A.gid !== g.id) return endGroup(false);
  const hn = S.hero.name;
  for (const id of g.members){ const e = S.ents[id]; if (!e) continue;
    if (walking(e)) { e.act = 'walk'; continue; }
    if (g.room !== 'out' && e.room !== g.room){ route(e, g.room, spotKey(A.act, g.room)); continue; }
    e.act = A.act; e.label = `和 ${hn}${g.members.length > 1 ? '、' + g.members.filter(x => x !== id).map(nm).join('、') : ''} ${g.v.replace(/了/, '')}`; }

function endGroup(done){

   作弊模式：主畫面左上角（時鐘下方）的小開關。打開＝可以在 🛠️ 面板改數值；關掉＝完全不能改（面板和所有編輯控制都隱藏）。
   用過作弊模式的存檔會一直帶著 🛠️ 標記；之後達成的成就也會標 🛠️。
   成就：一組基本的內建成就＋玩家自訂（名稱／圖示／說明＋條件）。可以分享成就清單、分享存檔檔案。
   所有玩家寫的字都用 esc() 或 textContent 顯示。 */
function cheatSync(){
  const c = $('#cheatChk'), b = $('#cheatBtn'); if (!c || !S) return;
  c.checked = !!S.cheat; b.classList.toggle('hidden', !S.cheat); $('#cheatSw').classList.toggle('on', !!S.cheat);
}
function setCheat(on){
  S.cheat = !!on; if (on && !S.cheatUsed){ S.cheatUsed = S.t; log('🛠️ 打開了作弊模式。這個存檔之後會帶著 🛠️ 標記。', ['h']); }
  cheatSync();
  if (on) openCheat(); else { if (ui.sheet && ui.sheet.cheat) closeSheet(); document.querySelectorAll('[data-ck],[data-ckcd],#ckCoef0,#ckText,#ckNpc,#nmForm,#nmList,#txList,#txFields').forEach(n => n.remove()); }
  save(); toast(on ? '🛠️ 作弊模式：可以修改數值' : '作弊模式關閉：數值不能修改');
  if (ui.view === 'save' || ui.view === 'ach') renderView(ui.view);
}
// 可以改的數值：[標籤, 取值, 設值, 最小, 最大]
function cheatFields(){
  const f = [];
  for (const id of S.residents){
    f.push([id, `${nm(id)} 對你的好感`, () => S.aff[id].h, v => { S.aff[id].h = v; }, -100, 100]);
    f.push([id, `${nm(id)} 對你的情慾`, () => S.des[id].h, v => { S.des[id].h = v; }, 0, 100]);
    f.push([id, `你對 ${nm(id)} 的好感`, () => S.aff.h[id], v => { S.aff.h[id] = v; }, -100, 100]);
    f.push([id, `${nm(id)} 的醋意`, () => S.jeal[id] || 0, v => { S.jeal[id] = v; }, 0, 100]);
  }
  f.push(['h', '你的心情', () => hMood(), v => { S.hero.mood = v; }, 0, 100]);
  for (const k of Object.keys(NEED_LBL)) f.push(['h', `你的${NEED_LBL[k]}`, () => S.ents.h.needs[k], v => { S.ents.h.needs[k] = v; }, 0, 100]);
  // 室友之間：交情（雙向一起改）與競爭
  const R = S.residents;
  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++){ const a = R[i], b = R[j], k = pkey(a, b);
    f.push(['pair', `${nm(a)} ⇄ ${nm(b)} 交情`, () => pairV(a, b), v => { S.aff[a][b] = v; S.aff[b][a] = v; }, -100, 100]);
    f.push(['pair', `${nm(a)} ⇄ ${nm(b)} 競爭`, () => S.rival[k] || 0, v => { S.rival[k] = v; }, 0, 100]); }
  // 個性係數（影響吃醋、被逗笑、被稱讚、被撩的反應）
  for (const id of R) for (const [k, n] of COEF_LBL) f.push(['coef', `${nm(id)}・${n}`, () => CHAR[id][k], v => { (S.coef[id] = S.coef[id] || {})[k] = v; CHAR[id][k] = v; }, 0, 1.5, 0.05]);
  return f;
}
function openCheat(){
  if (!S || !S.cheat) return false;
  openSheet(() => {
    const F = cheatFields(); let last = null;
    $('#sheet').innerHTML = `<div class="grab"></div><h3>🛠️ 修改數值 <span class="pill">作弊模式</span></h3>
      <div class="small muted">拖動或輸入數字，馬上生效。關掉左上角的「作弊」開關就不能再改。</div>
      <div class="cheatpanel">${F.map((x, i) => { const head = x[0] !== last ? `<div class="cksec" id="cks-${x[0]}">${x[0] === 'h' ? esc(S.hero.name) : x[0] === 'pair' ? '室友之間（交情／競爭）' : x[0] === 'coef' ? '個性係數（0～1.5）' : esc(nm(x[0]))}</div>` : ''; last = x[0];
        const st = x[6] || 1, v = Math.round(x[2]() / st) * st, vs = st < 1 ? v.toFixed(2) : v; return head + `<label class="ckrow"><span>${esc(x[1])}</span><input type="range" min="${x[4]}" max="${x[5]}" step="${st}" value="${vs}" data-ck="${i}"><input type="number" min="${x[4]}" max="${x[5]}" step="${st}" value="${vs}" data-ck="${i}" inputmode="decimal"></label>`; }).join('')}
        <div class="cksec">邀約／拒絕的冷卻</div><div class="ckcd">${S.residents.map(id => `<button type="button" class="btn sm" data-ckcd="${id}">重置 ${esc(nm(id))}</button>`).join('')}<button type="button" class="btn sm" data-ckcd="all">全部重置</button></div>
        <button type="button" class="btn wide" id="ckCoef0">個性係數還原成預設</button></div>
      <button class="btn wide" id="ckNpc">🧩 自訂室友行為（新活動、室友之間、來找你的事件）</button><button class="btn wide" id="ckText">📝 修改遊戲裡的文字（事件、台詞、日記…）</button><button class="btn wide" id="ckClose">完成</button>`;
    const apply = (i, raw) => { if (!S.cheat) return; const x = F[i], st = x[6] || 1, v = clamp(Math.round(Number(raw) / st) * st, x[4], x[5]); if (!Number.isFinite(v)) return; x[3](st < 1 ? Math.round(v * 100) / 100 : v);
      $('#sheet').querySelectorAll(`[data-ck="${i}"]`).forEach(n => { if (Math.abs(+n.value - v) > 1e-9) n.value = st < 1 ? v.toFixed(2) : v; });
      if (CHAR[x[0]]){ S.tiers[x[0]] = S.tiers[x[0]] ?? tierIdx(x[0]); checkTier(x[0]); } achThink(); save(); };
    $('#sheet').querySelectorAll('[data-ck]').forEach(n => { n.oninput = () => apply(+n.dataset.ck, n.value); n.onchange = () => { apply(+n.dataset.ck, n.value); renderAll(true); }; });
    $('#ckClose').onclick = closeSheet;
    $('#sheet').querySelectorAll('[data-ckcd]').forEach(b => b.onclick = () => { resetCooldowns(b.dataset.ckcd); toast(b.dataset.ckcd === 'all' ? '已重置所有人的冷卻' : `已重置 ${nm(b.dataset.ckcd)} 的冷卻`); });
    $('#ckCoef0').onclick = () => { resetCoef(); toast('個性係數已還原成預設'); ui.sheet.render(); };
    $('#ckNpc').onclick = () => openNpcMods();
    $('#ckText').onclick = () => { txUi.item = null; openTextEditor(); };
  }, false);
  ui.sheet.cheat = true; return true;
}
const COEF_LBL = [['jealousy', '醋意'], ['joke', '被逗笑'], ['praise', '被稱讚'], ['flirt', '被撩']];
const COEF0 = Object.fromEntries(CHARS.map(c => [c.id, Object.fromEntries(COEF_LBL.map(([k]) => [k, c[k]]))]));
// 讀檔時：先還原預設，再套用這個存檔改過的係數
function applyCoef(){ for (const c of CHARS){ for (const [k] of COEF_LBL) c[k] = COEF0[c.id][k]; const o = S && S.coef && S.coef[c.id]; if (o) for (const [k] of COEF_LBL) if (typeof o[k] === 'number' && isFinite(o[k])) c[k] = clamp(o[k], 0, 1.5); } }
function resetCoef(){ if (!S.cheat) return false; S.coef = {}; applyCoef(); save(); return true; }
function resetCooldowns(who){ if (!S.cheat) return false; const L = who === 'all' ? S.residents : [who];
  for (const id of L){ S.reqCd[id] = 0; S.rejN[id] = 0; S.lastReq[id] = -99999; }
  if (who === 'all'){ S.lastAnyReq = -99999; S.lastCollide = -99999; } save(); return true; }
/* ---- 成就 ---- */
const anyRes = f => S.residents.some(f), allRes = f => S.residents.length && S.residents.every(f);
const ACH = [
  {id:'day2', icon:'🌅', n:'第一天過去了', d:'在公寓度過第一天。', ok:() => dayOf(S.t) >= 2},
  {id:'week', icon:'📅', n:'住滿一週', d:'在公寓住滿七天。', ok:() => dayOf(S.t) >= 8},
  {id:'friend', icon:'🤝', n:'第一位朋友', d:'有一位室友對你的好感到 40。', ok:() => anyRes(id => S.aff[id].h >= 40)},
  {id:'allknow', icon:'🏠', n:'大家都熟了', d:'每位室友對你的好感都到 20。', ok:() => allRes(id => S.aff[id].h >= 20)},
  {id:'crush', icon:'💗', n:'心動', d:'和一位室友的關係走到「心動」。', ok:() => anyRes(id => relTier(id) >= 3)},
  {id:'soul', icon:'💞', n:'非你不可', d:'有一位室友對你的好感到 80。', ok:() => anyRes(id => S.aff[id].h >= 80)},
  {id:'group1', icon:'🎉', n:'一起比較熱鬧', d:'第一次和室友們一起做事。', ok:() => (S.grpN || 0) >= 1},
  {id:'group5', icon:'🍿', n:'公寓的日常', d:'和室友們一起做事 5 次。', ok:() => (S.grpN || 0) >= 5},
  {id:'crowd', icon:'👨‍👩‍👦', n:'全員集合', d:'一次約到 3 位以上的室友一起。', ok:() => (S.grpMax || 0) >= 3},
  {id:'laugh', icon:'😆', n:'讓他笑了', d:'逗笑從來不笑的 Alexander。', ok:() => !!S.firsts.laugh},
  {id:'custom', icon:'✨', n:'自己寫的劇本', d:'完成一次自訂互動。', ok:() => (S.cxDone || 0) >= 1},
  {id:'diary7', icon:'📔', n:'七篇日記', d:'寫滿七天的日記。', ok:() => (S.diary.h || []).length >= 7},
  {id:'rival', icon:'⚡', n:'修羅場', d:'兩位室友為你較勁到 20。', ok:() => Object.values(S.rival || {}).some(v => v >= 20)},
];
// 自訂成就的條件
const ACH_COND = {
  aff:{n:'好感達到', who:true, max:100, min:-100}, des:{n:'情慾達到', who:true, max:100, min:0}, tier:{n:'關係階段達到（0 日常～3 心動）', who:true, max:3, min:0},
  day:{n:'住到第幾天', who:false, max:365, min:1}, group:{n:'一起做事的次數', who:false, max:999, min:1}, cx:{n:'完成自訂互動的次數', who:false, max:999, min:1}, mood:{n:'你的心情達到', who:false, max:100, min:0},
};
function achCondOk(c){
  const n = c.n, w = c.who || 'any', f = id => c.type === 'aff' ? S.aff[id].h >= n : c.type === 'des' ? S.des[id].h >= n : relTier(id) >= n;
  if (ACH_COND[c.type].who){ if (w === 'any') return anyRes(f); if (w === 'all') return allRes(f); return S.residents.includes(w) && f(w); }
  return c.type === 'day' ? dayOf(S.t) >= n : c.type === 'group' ? (S.grpN || 0) >= n : c.type === 'cx' ? (S.cxDone || 0) >= n : hMood() >= n;
}
const achClean = o => { if (!o || typeof o !== 'object') return null; const n = cxClip(o.n, 20); if (!n) return null; const t = ACH_COND[o.type] ? o.type : 'aff', C = ACH_COND[t];
  const who = o.who === 'all' || o.who === 'any' || (CHAR[o.who]) ? o.who : 'any';
  return {id:/^ca_[a-z0-9]{4,16}$/.test(o.id || '') ? o.id : 'ca_' + Math.random().toString(36).slice(2, 10), n, icon:cxClip(o.icon, 2) || '🏅', d:cxClip(o.d, 60), type:t, who, num:cxNum(o.num, C.min, C.max, Math.min(C.max, 50))}; };
function achList(){ return [...ACH, ...(S.achCustom || []).map(c => ({id:c.id, icon:c.icon, n:c.n, d:c.d || `${ACH_COND[c.type].n} ${c.num}${ACH_COND[c.type].who ? `（${c.who === 'any' ? '任一位室友' : c.who === 'all' ? '所有室友' : nm(c.who)}）` : ''}`, custom:true, ok:() => achCondOk({type:c.type, who:c.who, n:c.num})}))]; }
function achThink(){
  if (!S) return; S.ach = S.ach || {};
  for (const a of achList()){ if (S.ach[a.id]) continue; let ok = false; try { ok = a.ok(); } catch(e){}
    if (ok){ S.ach[a.id] = {t:S.t, cheat:!!S.cheatUsed}; log(`🏆 達成成就「${a.n}」${S.cheatUsed ? '（🛠️）' : ''}`, ['h'], 'big'); toast(`🏆 ${a.icon} ${a.n}`); } }
}
function renderAchView(){ const box = $('#v-ach'); box.innerHTML = ''; achSection(box); }
function achSection(box){
  const L = achList(), got = S.ach || {}, nGot = L.filter(a => got[a.id]).length;
  const card = el('div'); card.innerHTML = `<h3 class="sec">🏆 成就 <span class="muted small">${nGot} / ${L.length}</span>${S.cheatUsed ? ' <span class="pill cheatbadge" title="這個存檔用過作弊模式">🛠️ 用過作弊模式</span>' : ''}</h3>
    <div class="card achlist">${L.map(a => { const g = got[a.id]; return `<div class="ach${g ? ' got' : ''}" data-ach="${esc(a.id)}"><span class="ai">${g ? esc(a.icon) : '🔒'}</span><span class="an"><b>${esc(a.n)}${g && g.cheat ? ' <span class="cheatbadge" title="在用過作弊模式之後達成">🛠️</span>' : ''}${a.custom ? ' <small class="pill">自訂</small>' : ''}</b><small>${esc(a.d)}${g ? `・第 ${dayOf(g.t)} 天達成` : ''}</small></span>${a.custom ? `<button class="btn sm" data-ace="${esc(a.id)}">編輯</button>` : ''}</div>`; }).join('')}
      <button class="btn wide" id="achAdd">＋ 自訂成就</button>
      <button class="btn wide" id="achShare" style="margin-top:8px">📤 分享成就</button>
      <textarea class="sharebox hidden" id="shareBox" rows="5" readonly></textarea></div>`;
  box.appendChild(card);
  $('#achAdd').onclick = () => openAchForm();
  card.querySelectorAll('[data-ace]').forEach(b => b.onclick = () => openAchForm(b.dataset.ace));
  $('#achShare').onclick = shareAch;
}
function achShareText(){
  const L = achList(), got = S.ach || {}, g = L.filter(a => got[a.id]);
  return `《失衡》${S.hero.name}・第 ${dayOf(S.t)} 天\n🏆 成就 ${g.length} / ${L.length}${S.cheatUsed ? '（🛠️ 這個存檔用過作弊模式）' : ''}\n` + g.map(a => `${a.icon} ${a.n}${got[a.id].cheat ? ' 🛠️' : ''}`).join('\n');
}
async function shareAch(){
  const t = achShareText(), box = $('#shareBox');
  try { if (navigator.share){ await navigator.share({title:'《失衡》成就', text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  box.value = t; box.classList.remove('hidden'); box.select();
  try { await navigator.clipboard.writeText(t); toast('已複製成就清單'); } catch(e){ toast('成就清單在下面，可以手動複製'); }
}
async function shareSave(){
  save(); const name = `失衡存檔_${S.hero.name}_第${dayOf(S.t)}天${S.cheatUsed ? '_作弊' : ''}.json`;
  try { const file = new File([JSON.stringify(S)], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'《失衡》存檔'}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  exportSave(); toast('這台裝置不能直接分享，已改成下載存檔檔案');
}
function openAchForm(aid){
  const old = aid ? (S.achCustom || []).find(c => c.id === aid) : null;
  const c = old || {n:'', icon:'', d:'', type:'aff', who:'any', num:50};
  openSheet(() => {
    const opt = (v, n, cur) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(n)}</option>`;
    $('#sheet').innerHTML = `<div class="grab"></div><h3>${old ? '編輯自訂成就' : '＋ 自訂成就'}</h3>
      <form id="achForm" class="cxform" autocomplete="off">
        <label class="cxf"><span>名稱 <b class="req">必填</b></span><input name="n" maxlength="20" required value="${esc(c.n)}" placeholder="例如：Samuel 終於敢看我"></label>
        <label class="cxf cx-s"><span>圖示（emoji）</span><input name="icon" maxlength="8" value="${esc(c.icon)}" placeholder="🏅"></label>
        <label class="cxf"><span>說明（可空白）</span><input name="d" maxlength="60" value="${esc(c.d)}"></label>
        <label class="cxf"><span>條件</span><select name="type">${Object.entries(ACH_COND).map(([k, v]) => opt(k, v.n, c.type)).join('')}</select></label>
        <label class="cxf cx-s" id="achWho"><span>對象</span><select name="who">${opt('any', '任一位室友', c.who)}${opt('all', '所有室友', c.who)}${S.residents.map(id => opt(id, nm(id), c.who)).join('')}</select></label>
        <label class="cxf cx-s"><span>數值</span><input name="num" type="number" inputmode="numeric" value="${c.num}"></label>
        <div class="cxacts"><button type="button" class="btn" id="acCancel">取消</button>${old ? '<button type="button" class="btn danger" id="acDel">刪除</button>' : ''}<button type="submit" class="btn primary">儲存</button></div>
      </form>`;
    const f = $('#achForm'), sync = () => { $('#achWho').hidden = !ACH_COND[f.type.value].who; f.num.min = ACH_COND[f.type.value].min; f.num.max = ACH_COND[f.type.value].max; };
    f.type.onchange = sync; sync();
    $('#acCancel').onclick = () => { closeSheet(); switchView('ach'); };
    const del = $('#acDel'); if (del) del.onclick = () => { S.achCustom = S.achCustom.filter(x => x.id !== aid); delete (S.ach || {})[aid]; save(); closeSheet(); renderView('ach'); toast('已刪除自訂成就'); };
    f.onsubmit = ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f).entries()); d.id = old ? old.id : undefined; const a = achClean(d);
      if (!a){ toast('請先填成就的名稱'); return; }
      S.achCustom = S.achCustom || []; if (old) S.achCustom[S.achCustom.findIndex(x => x.id === old.id)] = a; else S.achCustom.push(a);
      if (old && S.ach) delete S.ach[a.id];   // 條件改了就重新判斷
      achThink(); save(); closeSheet(); switchView('ach'); toast(`已儲存「${a.n}」`); };
  }, false);
}
Object.assign(window.__imb, { renderAchView, applyCoef, resetCoef, resetCooldowns, COEF0, setCheat, openCheat, cheatFields, achThink, achList, achCondOk, achClean, achShareText, openAchForm, ACH });

</script>
<script>
/* ---------- 作弊模式：修改遊戲裡的文字 ----------
   每一句和角色有關、玩家看得到的文字（事件、邀約、回應、吃醋、撞見、日記、回憶、台詞、泡泡小故事、作息狀態……）
   都可以改。修改存成「覆蓋」放在存檔裡（S.textOv），不動預設；可以單項／整個角色還原，也可以單獨匯出／匯入。
   作弊模式關掉時：修改照樣生效，但不能再改。玩家寫的字一律用 textContent／esc() 顯示，並把 < > 換成全形。 */
const TX_TABLES = {EVENTS, TEST_EV, COLLIDE_OPEN, COLLIDE_LOSE, WITNESS, WITNESS_FLOOR, REQUESTS, IK_REQ, STAGED_REQ, H_LINES, H_LINES_EXTRA, PERSONA_LINES, STAGE_LINES, CX_LINES, IK_LINES,
  GRP_LINES, REJECT_LINES, REJ, ALT_LINES, ACCEPT_END, INTIMATE_START, INTIMATE_END, INTIMATE_SCENE, AFTERCARE, TALK, MEM_VOICE, DIARY, IK_DIARY, QUIPS, COOK_SHARE, NPC_SPECIAL, PAIR_NOTE, NPC_REL_NOTE,
  SNIP, SNIP_H, H_DIARY, TRAIT_VOICE, NPC_CHAT_LINES, NPC_BAD_LINES, RIVAL_LINES, GRP_TENSE, GRP_WARM, CAUGHT_LINES, LEAVE_LINES, SNIP_CX_GENERIC, ACTS, CHARS};
const TX_CAT = {EVENTS:'事件', TEST_EV:'吃醋試探', COLLIDE_OPEN:'兩人同時找你', COLLIDE_LOSE:'兩人同時找你', WITNESS:'撞見・吃醋反應', WITNESS_FLOOR:'撞見・吃醋反應', CAUGHT_LINES:'撞見（共用）', LEAVE_LINES:'撞見（共用）',
  REQUESTS:'他主動的邀約', IK_REQ:'他主動的邀約', STAGED_REQ:'他主動的邀約', H_LINES:'你邀他時的回應', H_LINES_EXTRA:'你邀他時的回應', PERSONA_LINES:'你邀他時的回應', STAGE_LINES:'你邀他時的回應', CX_LINES:'你邀他時的回應', IK_LINES:'你邀他時的回應',
